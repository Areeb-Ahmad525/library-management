[project]
name = "library-management"
version = "0.1.0"
description = "Core Python library management system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.4.0",
    "ruff>=0.9.0",
]
